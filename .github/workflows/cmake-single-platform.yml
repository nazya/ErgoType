name: Build and Test ErgoType Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read  # Required by actions/checkout

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Clone submodules recursively

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install cmake gcc-13 g++-13 build-essential -y

    - name: Setup Arm GNU Toolchain 14.2.Rel1
      run: |
        arm_archive=arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
        curl --fail --location --retry 3 \
          "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$arm_archive" \
          --output "$RUNNER_TEMP/$arm_archive"
        echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  $RUNNER_TEMP/$arm_archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/arm-toolchain"
        tar -xf "$RUNNER_TEMP/$arm_archive" -C "$RUNNER_TEMP/arm-toolchain" --strip-components=1
        echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"
        echo "PICO_TOOLCHAIN_PATH=$RUNNER_TEMP/arm-toolchain" >> "$GITHUB_ENV"

    - name: Setup Pico SDK
      run: |
        mkdir -p ~/.pico-sdk
        git clone --recurse-submodules https://github.com/raspberrypi/pico-sdk.git --branch 2.1.1 ~/.pico-sdk
    
    - name: Modify ffconf.h to Set FF_USE_STRFUNC=1
      run: |
        sed -i 's/^#define FF_USE_STRFUNC.*/#define FF_USE_STRFUNC  1/' ~/.pico-sdk/lib/tinyusb/lib/fatfs/source/ffconf.h
        cat ~/.pico-sdk/lib/tinyusb/lib/fatfs/source/ffconf.h | grep "FF_USE_STRFUNC"

    - name: Configure Pico SDK Path
      run: echo "PICO_SDK_PATH=$HOME/.pico-sdk" >> $GITHUB_ENV

    - name: Build Project
      env:
        PICO_SDK_PATH: ${{ env.PICO_SDK_PATH }}
      run: |
        "$CC" --version
        "$CXX" --version
        arm-none-eabi-gcc --version
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)

    - name: Verify Firmware Binary
      run: |
        test -f build/ErgoType.uf2

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-uf2
        path: build/ErgoType.uf2
